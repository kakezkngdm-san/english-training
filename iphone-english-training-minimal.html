<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iPhone英作文トレーニング</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* 設定パネル */
        #settingsPanel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #settingsPanel.collapsed {
            max-height: 50px;
            overflow: hidden;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .settings-header h2 {
            font-size: 1.1rem;
            color: #4ecdc4;
        }

        .toggle-btn {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            color: #4ecdc4;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .setting-group {
            margin-bottom: 12px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #b8b8b8;
        }

        .setting-group input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        .setting-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
            color: #4ecdc4;
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .theme-btn {
            flex: 1;
            min-width: 90px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
        }

        .theme-btn.active {
            background: rgba(78, 205, 196, 0.3);
            border-color: #4ecdc4;
            color: #4ecdc4;
        }

        /* メインコントロール */
        #mainControl {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #statusDisplay {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        #currentQuestion {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #userAnswer {
            font-size: 1.1rem;
            color: #ffd93d;
            margin-bottom: 10px;
            min-height: 30px;
            font-style: italic;
        }

        #feedback {
            font-size: 1rem;
            color: #95e1d3;
            margin-bottom: 8px;
            min-height: 25px;
        }

        #correctAnswer {
            font-size: 0.95rem;
            color: #b8b8b8;
            min-height: 25px;
        }

        /* コントロールボタン */
        #controlButton {
            width: 90%;
            max-width: 400px;
            height: 120px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border: none;
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
            margin-bottom: 15px;
        }

        #controlButton.paused {
            background: linear-gradient(135deg, #f38181 0%, #aa4465 100%);
        }

        #controlButton.listening {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 10px 50px rgba(78, 205, 196, 0.6);
                transform: scale(1.02);
            }
        }

        /* テストボタン */
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .test-btn {
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 10px;
            color: #ffd700;
            font-size: 0.9rem;
        }

        /* 統計 */
        #stats {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.75rem;
            color: #b8b8b8;
            margin-bottom: 3px;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4ecdc4;
        }

        /* 初期化オーバーレイ */
        .init-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .init-overlay h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #4ecdc4;
            text-align: center;
        }

        .init-overlay p {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #b8b8b8;
            text-align: center;
            line-height: 1.5;
        }

        .init-button {
            padding: 18px 50px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border: none;
            border-radius: 15px;
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
        }

        .hidden {
            display: none !important;
        }

        /* デバッグログ */
        #debugLog {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            font-family: monospace;
            font-size: 0.7rem;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        #debugLog.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 初期化オーバーレイ -->
    <div id="initOverlay" class="init-overlay">
        <h1>🎯 iPhone英作文トレーニング</h1>
        <p>
            音声機能を有効化します<br>
            <strong>音量を上げてください</strong><br>
            サイレントモードを解除してください
        </p>
        <button class="init-button" onclick="initializeApp()">タップして開始</button>
    </div>

    <!-- 設定パネル -->
    <div id="settingsPanel" class="collapsed">
        <div class="settings-header">
            <h2>⚙️ 設定</h2>
            <button class="toggle-btn" onclick="toggleSettings()">開く</button>
        </div>

        <div id="settingsContent">
            <div class="setting-group">
                <label>考える時間: <span class="slider-value" id="thinkTimeValue">8</span>秒</label>
                <input type="range" id="thinkTime" min="5" max="15" value="8" oninput="updateThinkTime(this.value)">
            </div>

            <div class="setting-group">
                <label>正解リピート回数: <span class="slider-value" id="repeatCountValue">3</span>回</label>
                <input type="range" id="repeatCount" min="1" max="5" value="3" oninput="updateRepeatCount(this.value)">
                <div style="margin-top: 5px; font-size: 0.75rem; color: #b8b8b8;">
                    正解の英文を繰り返す回数
                </div>
            </div>

            <div class="setting-group">
                <label>認識感度:</label>
                <div class="theme-selector">
                    <button class="theme-btn" data-sensitivity="strict" onclick="setSensitivity(this)">厳格</button>
                    <button class="theme-btn active" data-sensitivity="normal" onclick="setSensitivity(this)">通常</button>
                    <button class="theme-btn" data-sensitivity="loose" onclick="setSensitivity(this)">ゆるい</button>
                </div>
                <div style="margin-top: 5px; font-size: 0.75rem; color: #b8b8b8;">
                    ゆるい: 単語が合っていればOK<br>
                    通常: 70%以上の単語が一致<br>
                    厳格: ほぼ完璧に一致
                </div>
            </div>

            <div class="setting-group">
                <label>出題テーマ:</label>
                <div class="theme-selector">
                    <button class="theme-btn active" data-theme="liverpool" onclick="toggleTheme(this)">リバプール</button>
                    <button class="theme-btn active" data-theme="ive" onclick="toggleTheme(this)">IVE</button>
                    <button class="theme-btn active" data-theme="economy" onclick="toggleTheme(this)">経済</button>
                </div>
            </div>

            <div class="setting-group">
                <label>文法選択: <span id="grammarCount" style="color: #4ecdc4; font-size: 0.8rem;">全て選択</span></label>
                <div class="theme-selector" style="gap: 5px;" id="grammarSelector">
                    <button class="theme-btn active" data-grammar="現在形" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">現在形</button>
                    <button class="theme-btn active" data-grammar="過去形" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">過去形</button>
                    <button class="theme-btn active" data-grammar="未来形" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">未来形</button>
                    <button class="theme-btn active" data-grammar="現在進行形" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">現在進行形</button>
                    <button class="theme-btn active" data-grammar="現在完了" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">現在完了</button>
                    <button class="theme-btn active" data-grammar="助動詞" onclick="toggleGrammar(this)" style="font-size: 0.75rem; padding: 6px;">助動詞</button>
                </div>
                <div style="margin-top: 8px;">
                    <button class="test-btn" onclick="selectAllGrammars()" style="padding: 6px 12px; font-size: 0.8rem;">全て選択</button>
                    <button class="test-btn" onclick="clearAllGrammars()" style="padding: 6px 12px; font-size: 0.8rem;">全て解除</button>
                </div>
                <div style="margin-top: 5px; font-size: 0.75rem; color: #b8b8b8;">
                    学習したい文法を選択（選択なし=全て）
                </div>
            </div>

            <div class="setting-group">
                <label>カスタム問題CSV:</label>
                <input type="file" id="csvUpload" accept=".csv" onchange="handleCSVUpload(event)" style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 0.85rem;">
                <div style="margin-top: 5px; font-size: 0.75rem; color: #b8b8b8;">
                    形式: 英語,日本語<br>
                    例: Liverpool won last night,リバプールは昨夜勝った
                </div>
                <div id="csvStatus" style="margin-top: 5px; font-size: 0.8rem; color: #4ecdc4;"></div>
            </div>

            <div class="setting-group">
                <label>Gemini APIキー (オプション):</label>
                <input type="text" id="apiKey" placeholder="AIzaSy..." style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 0.85rem;" onchange="saveSettings()">
                <div style="margin-top: 5px; font-size: 0.75rem; color: #ffd93d;">
                    空欄の場合は内蔵問題を使用します
                </div>
            </div>
        </div>
    </div>

    <!-- メインコントロール -->
    <div id="mainControl">
        <div id="statusDisplay">
            <div id="currentQuestion">準備中...</div>
            <div id="userAnswer"></div>
            <div id="feedback"></div>
            <div id="correctAnswer"></div>
        </div>

        <!-- テストボタン -->
        <div class="test-buttons">
            <button class="test-btn" onclick="testSpeech()">🔊 音声テスト</button>
            <button class="test-btn" onclick="testRecognition()">🎤 認識テスト</button>
            <button class="test-btn" onclick="toggleDebug()">📋 ログ</button>
        </div>

        <button id="controlButton" onclick="toggleTraining()">
            トレーニング開始
        </button>

        <div id="stats">
            <div class="stat-item">
                <div class="label">問題数</div>
                <div class="value" id="questionCount">0</div>
            </div>
            <div class="stat-item">
                <div class="label">正解</div>
                <div class="value" id="correctCount">0</div>
            </div>
        </div>
    </div>

    <!-- デバッグログ -->
    <div id="debugLog"></div>

    <script>
        // グローバル変数
        let isRunning = false;
        let recognition = null;
        let currentQuestion = null;
        let currentAnswer = null;
        let isListening = false;
        let selectedThemes = ['liverpool', 'ive', 'economy'];
        let stats = { total: 0, correct: 0 };
        let debugMode = false;
        let customQuestions = []; // カスタム問題
        let sensitivity = 'normal'; // 認識感度: strict, normal, loose
        let repeatCount = 3; // 正解リピート回数
        let selectedGrammars = []; // 選択された文法（空=全て選択）
        let completedQuestionIndices = []; // 完了した問題のインデックス

        // デバッグログ
        function log(message) {
            console.log(message);
            if (debugMode) {
                const logDiv = document.getElementById('debugLog');
                const time = new Date().toLocaleTimeString();
                logDiv.innerHTML += `[${time}] ${message}<br>`;
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        }

        function toggleDebug() {
            debugMode = !debugMode;
            document.getElementById('debugLog').classList.toggle('show');
        }

        // フォールバック問題データ（30問）
        const fallbackQuestions = [
            // リバプールFC（10問）
            { japanese: "リバプールは昨夜勝ちました", english: "Liverpool won last night", grammar: "過去形" },
            { japanese: "サラーはゴールを決めます", english: "Salah scores a goal", grammar: "現在形" },
            { japanese: "アリソンは守っています", english: "Alisson is protecting", grammar: "現在進行形" },
            { japanese: "ダーウィン・ヌニェスは速いです", english: "Darwin Nunez is fast", grammar: "形容詞" },
            { japanese: "リバプールは強いチームです", english: "Liverpool is a strong team", grammar: "名詞" },
            { japanese: "ヴィルジル・ファン・ダイクはディフェンダーです", english: "Virgil van Dijk is a defender", grammar: "名詞" },
            { japanese: "トレント・アレクサンダー・アーノルドはクロスを上げました", english: "Trent Alexander-Arnold crossed the ball", grammar: "過去形" },
            { japanese: "リバプールは次の試合に勝つでしょう", english: "Liverpool will win the next match", grammar: "未来形" },
            { japanese: "サラーはプレミアリーグで最も速い選手の一人です", english: "Salah is one of the fastest players in the Premier League", grammar: "最上級" },
            { japanese: "チームはアンフィールドで練習しています", english: "The team is training at Anfield", grammar: "現在進行形" },
            
            // IVE（10問）
            { japanese: "IVEは新曲を出します", english: "IVE releases a new song", grammar: "現在形" },
            { japanese: "ウォニョンは歌っています", english: "Wonyoung is singing", grammar: "現在進行形" },
            { japanese: "ユジンはリーダーです", english: "Yujin is the leader", grammar: "名詞" },
            { japanese: "レイは日本語を話せます", english: "Rei can speak Japanese", grammar: "助動詞" },
            { japanese: "IVEは人気があります", english: "IVE is popular", grammar: "形容詞" },
            { japanese: "ガウルはダンスを練習しました", english: "Gaeul practiced dancing", grammar: "過去形" },
            { japanese: "イソは最も若いメンバーです", english: "Leeseo is the youngest member", grammar: "最上級" },
            { japanese: "IVEはソウルでコンサートを開くでしょう", english: "IVE will hold a concert in Seoul", grammar: "未来形" },
            { japanese: "ウォニョンはステージで踊ることを楽しみます", english: "Wonyoung enjoys dancing on stage", grammar: "動名詞" },
            { japanese: "レイはファンのために歌を録音しました", english: "Rei recorded a song for her fans", grammar: "過去形" },
            
            // 経済・金融（10問）
            { japanese: "市場は上がりました", english: "The market went up", grammar: "過去形" },
            { japanese: "投資家は買います", english: "Investors buy", grammar: "現在形" },
            { japanese: "経済は成長しています", english: "The economy is growing", grammar: "現在進行形" },
            { japanese: "金利は高いです", english: "Interest rates are high", grammar: "形容詞" },
            { japanese: "株価は下がりました", english: "Stock prices fell", grammar: "過去形" },
            { japanese: "中央銀行は政策を発表するでしょう", english: "The central bank will announce the policy", grammar: "未来形" },
            { japanese: "連邦準備制度は金利を引き上げました", english: "The Federal Reserve raised interest rates", grammar: "過去形" },
            { japanese: "その会社は利益を上げています", english: "The company is making profits", grammar: "現在進行形" },
            { japanese: "投資家は株を買いたいです", english: "Investors want to buy stocks", grammar: "不定詞" },
            { japanese: "市場は今年最も強いです", english: "The market is the strongest this year", grammar: "最上級" }
        ];

        // 音声合成（iPhone最適化版）
        function speak(text, lang = 'ja-JP') {
            return new Promise((resolve) => {
                log(`Speaking: ${text.substring(0, 30)}...`);
                
                // 既存の音声をキャンセル
                speechSynthesis.cancel();
                
                // 少し待ってから開始（iPhone対策）
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = lang === 'ja-JP' ? 0.9 : 0.85;
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;

                    let hasEnded = false;
                    
                    // タイムアウト（長めに設定）
                    const timeout = setTimeout(() => {
                        if (!hasEnded) {
                            log('Speech timeout');
                            hasEnded = true;
                            speechSynthesis.cancel();
                            resolve();
                        }
                    }, Math.max(text.length * 150, 5000));

                    utterance.onend = () => {
                        if (!hasEnded) {
                            log('Speech ended');
                            hasEnded = true;
                            clearTimeout(timeout);
                            resolve();
                        }
                    };

                    utterance.onerror = (event) => {
                        if (!hasEnded) {
                            log(`Speech error: ${event.error}`);
                            hasEnded = true;
                            clearTimeout(timeout);
                            resolve();
                        }
                    };

                    utterance.onstart = () => {
                        log('Speech started');
                    };

                    speechSynthesis.speak(utterance);
                    
                    // iPhone Safari対策：すぐにresumeを呼ぶ
                    setTimeout(() => {
                        if (speechSynthesis.paused) {
                            speechSynthesis.resume();
                        }
                    }, 100);
                }, 100);
            });
        }

        // 音声テスト
        async function testSpeech() {
            log('Testing speech synthesis...');
            updateStatus('音声テスト中...', '', '', '');
            await speak('こんにちは。音声が聞こえますか？');
            await speak('Hello. Can you hear me?', 'en-US');
            updateStatus('音声テスト完了', '', '聞こえましたか？', '');
        }

        // 音声認識テスト
        function testRecognition() {
            if (!recognition) {
                alert('音声認識が初期化されていません');
                return;
            }

            log('Testing speech recognition...');
            updateStatus('', '英語で何か話してください', '', '');
            
            const button = document.getElementById('controlButton');
            button.classList.add('listening');
            button.textContent = '聞いています...';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                log(`Recognized: ${transcript}`);
                updateStatus('', `認識: ${transcript}`, '成功！', '');
                button.classList.remove('listening');
                button.textContent = 'トレーニング開始';
            };

            recognition.onerror = (event) => {
                log(`Recognition error: ${event.error}`);
                updateStatus('', '', `エラー: ${event.error}`, '');
                button.classList.remove('listening');
                button.textContent = 'トレーニング開始';
            };

            try {
                recognition.start();
            } catch (e) {
                log(`Failed to start recognition: ${e.message}`);
            }
        }

        // 初期化
        async function initializeApp() {
            try {
                log('=== Initializing ===');
                
                // AudioContext初期化
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                await audioContext.resume();
                log('AudioContext OK');

                // 音声合成テスト
                const testUtterance = new SpeechSynthesisUtterance('テスト');
                testUtterance.volume = 0.1;
                speechSynthesis.speak(testUtterance);
                await new Promise(resolve => {
                    testUtterance.onend = resolve;
                    testUtterance.onerror = resolve;
                    setTimeout(resolve, 2000);
                });
                log('Speech synthesis OK');

                // 音声認識初期化
                if ('webkitSpeechRecognition' in window) {
                    recognition = new webkitSpeechRecognition();
                } else if ('SpeechRecognition' in window) {
                    recognition = new SpeechRecognition();
                } else {
                    throw new Error('音声認識に対応していません');
                }

                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                log('Speech recognition OK');

                // LocalStorageから設定読み込み
                loadSettings();

                // オーバーレイを非表示
                document.getElementById('initOverlay').classList.add('hidden');

                log('=== Initialization complete ===');
                await speak('初期化完了。音声が聞こえていますか？');
                
                updateStatus('準備完了！', '', 'トレーニング開始ボタンを押してください', '');
            } catch (error) {
                log(`Init error: ${error.message}`);
                alert(`初期化エラー: ${error.message}\n\nマイクと音声の許可を確認してください。`);
            }
        }

        // 問題生成（カスタム問題優先版）
        async function generateQuestion() {
            let availableQuestions = [];
            
            // カスタム問題が存在すればそれを使う
            if (customQuestions.length > 0) {
                log('Using custom questions');
                availableQuestions = [...customQuestions];
            } else {
                // フォールバックを使用
                availableQuestions = getFallbackQuestions();
            }
            
            // 文法でフィルター（選択されている場合）
            if (selectedGrammars.length > 0) {
                availableQuestions = availableQuestions.filter(q => 
                    selectedGrammars.includes(q.grammar)
                );
                log(`Filtered by grammar: ${availableQuestions.length} questions`);
            }
            
            if (availableQuestions.length === 0) {
                log('No questions available for selected grammar');
                await speak('選択された文法の問題がありません');
                stopTraining();
                return null;
            }
            
            // ランダムに選択
            const question = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
            return question;
        }

        // フォールバック問題を取得
        function getFallbackQuestions() {
            return generateFallbackQuestion();
        }

        // AI問題生成（カスタム問題がヒントになる）
        async function generateAIQuestion(apiKey) {
            let exampleStr = '';
            if (customQuestions.length > 0) {
                const example = customQuestions[0];
                exampleStr = `\n参考例: ${example.japanese} → ${example.english}`;
            }
            
            const prompt = `あなたは英語学習コーチです。瞬間英作文の問題を1つ生成してください。

【条件】
- テーマ: ${selectedThemes.join('、')}
${exampleStr}
- 文法: 中学〜高校基礎レベル（現在形、過去形、未来形、現在進行形、現在完了、不定詞、動名詞など）
- 自然で実用的な文

【重要】必ず以下のJSON形式のみで出力してください。
{
  "japanese": "日本語の問題文",
  "english": "正解の英文",
  "grammar": "使用した文法項目"
}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.9,
                        maxOutputTokens: 300
                    }
                })
            });

            if (!response.ok) throw new Error(`API Error: ${response.status}`);

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            
            const jsonMatch = text.match(/\{[\s\S]*?"japanese"[\s\S]*?"english"[\s\S]*?\}/);
            if (jsonMatch) {
                return JSON.parse(jsonMatch[0]);
            }
            
            throw new Error('JSON parsing failed');
        }

        // フォールバック問題生成
        function generateFallbackQuestion() {
            const filtered = fallbackQuestions.filter(q => {
                const text = (q.japanese + q.english).toLowerCase();
                return selectedThemes.some(theme => {
                    if (theme === 'liverpool') return text.includes('liverpool') || text.includes('リバプール') || text.includes('salah') || text.includes('サラー') || text.includes('alisson') || text.includes('アリソン') || text.includes('nunez') || text.includes('ヌニェス') || text.includes('virgil') || text.includes('ヴィルジル') || text.includes('trent') || text.includes('トレント');
                    if (theme === 'ive') return text.includes('ive') || text.includes('wonyoung') || text.includes('ウォニョン') || text.includes('yujin') || text.includes('ユジン') || text.includes('rei') || text.includes('レイ') || text.includes('gaeul') || text.includes('ガウル') || text.includes('leeseo') || text.includes('イソ');
                    if (theme === 'economy') return text.includes('market') || text.includes('市場') || text.includes('economy') || text.includes('経済') || text.includes('stock') || text.includes('株') || text.includes('invest') || text.includes('投資') || text.includes('interest') || text.includes('金利');
                    return false;
                });
            });

            return filtered.length > 0 ? filtered : fallbackQuestions;
        }

        // CSVアップロード処理（英語,日本語 形式）
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            log('Reading CSV file...');
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                customQuestions = [];
                
                let successCount = 0;
                let errorCount = 0;
                
                lines.forEach((line, index) => {
                    line = line.trim();
                    
                    // 空行やコメント行をスキップ
                    if (!line || line.startsWith('#')) return;
                    
                    // CSV解析: "英語","日本語","文法" または 英語,日本語,文法
                    const parts = line.split(',').map(p => p.trim().replace(/^["']|["']$/g, ''));
                    
                    if (parts.length >= 2) {
                        customQuestions.push({
                            english: parts[0],
                            japanese: parts[1],
                            grammar: parts[2] || 'その他' // 3列目がない場合は「その他」
                        });
                        successCount++;
                    } else {
                        log(`Line ${index + 1} skipped: invalid format`);
                        errorCount++;
                    }
                });
                
                // LocalStorageに保存
                try {
                    localStorage.setItem('customQuestions', JSON.stringify(customQuestions));
                    log(`Custom questions saved: ${customQuestions.length} questions`);
                } catch (error) {
                    log(`Failed to save custom questions: ${error.message}`);
                }
                
                // 新しい文法カテゴリーを動的に追加
                addNewGrammarButtons();
                
                const statusDiv = document.getElementById('csvStatus');
                if (customQuestions.length > 0) {
                    statusDiv.textContent = `✓ ${customQuestions.length}問を読み込みました`;
                    statusDiv.style.color = '#4ecdc4';
                    speak(`${customQuestions.length}問のカスタム問題を読み込みました`);
                } else {
                    statusDiv.textContent = `✗ 有効な問題が見つかりませんでした`;
                    statusDiv.style.color = '#f38181';
                }
                
                if (errorCount > 0) {
                    statusDiv.textContent += ` (${errorCount}行スキップ)`;
                }
                
                log(`Loaded: ${successCount} questions, ${errorCount} errors`);
            };
            
            reader.onerror = function() {
                log('CSV read error');
                const statusDiv = document.getElementById('csvStatus');
                statusDiv.textContent = '✗ ファイル読み込みエラー';
                statusDiv.style.color = '#f38181';
            };
            
            reader.readAsText(file);
        }

        // 簡易評価（感度対応版）
        function evaluateAnswer(userAnswer, correctAnswer) {
            const userLower = userAnswer.toLowerCase().trim();
            const correctLower = correctAnswer.toLowerCase().trim();

            // 完全一致
            if (userLower === correctLower) {
                return { score: 'perfect', feedback: '完璧です！', comment: '素晴らしい！' };
            }

            // 主要な単語を抽出（2文字以上）
            const correctWords = correctLower.split(/\s+/).filter(w => w.length > 2);
            const userWords = userLower.split(/\s+/);
            
            // 一致した単語数をカウント
            let matchedCount = 0;
            correctWords.forEach(correctWord => {
                if (userWords.some(userWord => 
                    userWord.includes(correctWord) || correctWord.includes(userWord)
                )) {
                    matchedCount++;
                }
            });

            const matchRate = correctWords.length > 0 ? matchedCount / correctWords.length : 0;
            
            log(`Match rate: ${Math.round(matchRate * 100)}% (${matchedCount}/${correctWords.length} words)`);

            // 感度別の判定
            let thresholds = {};
            if (sensitivity === 'strict') {
                thresholds = { perfect: 0.95, good: 0.85, acceptable: 0.70 };
            } else if (sensitivity === 'normal') {
                thresholds = { perfect: 0.90, good: 0.70, acceptable: 0.50 };
            } else { // loose
                thresholds = { perfect: 0.85, good: 0.60, acceptable: 0.40 };
            }

            if (matchRate >= thresholds.perfect) {
                return { score: 'perfect', feedback: '完璧です！', comment: '素晴らしい！' };
            } else if (matchRate >= thresholds.good) {
                return { score: 'good', feedback: 'いいですね！', comment: '意味が通じています' };
            } else if (matchRate >= thresholds.acceptable) {
                return { score: 'acceptable', feedback: '惜しい！', comment: 'もう少しです' };
            } else {
                return { score: 'incorrect', feedback: '正解を確認', comment: 'もう一度チャレンジ' };
            }
        }

        // 音声認識開始
        function startListening() {
            return new Promise((resolve) => {
                if (!recognition) {
                    log('Recognition not initialized');
                    resolve();
                    return;
                }

                log('Starting listening...');
                isListening = true;
                const button = document.getElementById('controlButton');
                button.classList.add('listening');
                button.textContent = '聞いています...';

                const thinkTime = parseInt(document.getElementById('thinkTime').value) * 1000;
                let hasAnswer = false;

                // タイムアウト
                const timeout = setTimeout(() => {
                    if (isListening) {
                        log('Listening timeout');
                        isListening = false;
                        try {
                            recognition.stop();
                        } catch (e) {
                            log(`Stop error: ${e.message}`);
                        }
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        resolve();
                    }
                }, thinkTime);

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript.trim();
                    log(`Recognized: ${transcript}`);
                    
                    if (transcript && isListening) {
                        hasAnswer = true;
                        currentAnswer = transcript;
                        isListening = false;
                        clearTimeout(timeout);
                        
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        
                        try {
                            recognition.stop();
                        } catch (e) {}
                        
                        resolve();
                    }
                };

                recognition.onerror = (event) => {
                    log(`Recognition error: ${event.error}`);
                    
                    if (isListening && event.error !== 'no-speech') {
                        isListening = false;
                        clearTimeout(timeout);
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        resolve();
                    }
                };

                recognition.onend = () => {
                    log('Recognition ended');
                    
                    if (isListening && !hasAnswer) {
                        // 再起動を試みる
                        setTimeout(() => {
                            if (isListening) {
                                try {
                                    log('Restarting recognition...');
                                    recognition.start();
                                } catch (e) {
                                    log(`Restart failed: ${e.message}`);
                                }
                            }
                        }, 300);
                    }
                };

                try {
                    recognition.start();
                    log('Recognition started');
                } catch (error) {
                    log(`Start error: ${error.message}`);
                    isListening = false;
                    clearTimeout(timeout);
                    button.classList.remove('listening');
                    resolve();
                }
            });
        }

        // トレーニング開始/停止
        async function toggleTraining() {
            if (isRunning) {
                stopTraining();
            } else {
                isRunning = true;
                const button = document.getElementById('controlButton');
                button.textContent = '一時停止';
                button.classList.remove('paused');
                await runTrainingLoop();
            }
        }

        function stopTraining() {
            log('Stopping training');
            isRunning = false;
            isListening = false;

            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }

            speechSynthesis.cancel();

            const button = document.getElementById('controlButton');
            button.textContent = 'トレーニング再開';
            button.classList.add('paused');
            button.classList.remove('listening');
        }

        // トレーニングループ
        async function runTrainingLoop() {
            log('=== Training loop started ===');
            
            while (isRunning) {
                try {
                    // 1. 問題生成
                    currentQuestion = await generateQuestion();
                    currentAnswer = null;
                    stats.total++;
                    updateStats();

                    log(`Question: ${currentQuestion.japanese}`);
                    updateStatus(currentQuestion.japanese, '', '', '');

                    // 2. 出題
                    await speak(currentQuestion.japanese);
                    if (!isRunning) break;

                    await sleep(800);

                    // 3. 音声認識
                    await startListening();
                    if (!isRunning) break;

                    log(`Answer: ${currentAnswer || '(none)'}`);

                    // 4. 評価
                    if (currentAnswer) {
                        const evaluation = evaluateAnswer(currentAnswer, currentQuestion.english);
                        
                        if (evaluation.score === 'perfect' || evaluation.score === 'good') {
                            stats.correct++;
                        }
                        updateStats();

                        const feedbackText = `${evaluation.feedback}`;
                        updateStatus(currentQuestion.japanese, currentAnswer, feedbackText, `正解: ${currentQuestion.english}`);
                        
                        await speak(feedbackText);
                        await sleep(500);
                        
                        // 正解を複数回リピート
                        log(`Repeating correct answer ${repeatCount} times`);
                        for (let i = 0; i < repeatCount; i++) {
                            if (!isRunning) break;
                            
                            log(`Repeat ${i + 1}/${repeatCount}`);
                            await speak(currentQuestion.english, 'en-US');
                            
                            // 最後のリピート以外は間隔を空ける
                            if (i < repeatCount - 1) {
                                await sleep(1200);
                            }
                        }
                    } else {
                        updateStatus(currentQuestion.japanese, '(回答なし)', '正解を確認', `正解: ${currentQuestion.english}`);
                        await speak('正解を言います');
                        await sleep(300);
                        
                        // 回答なしの場合もリピート
                        log(`Repeating correct answer ${repeatCount} times (no answer case)`);
                        for (let i = 0; i < repeatCount; i++) {
                            if (!isRunning) break;
                            
                            log(`Repeat ${i + 1}/${repeatCount}`);
                            await speak(currentQuestion.english, 'en-US');
                            
                            if (i < repeatCount - 1) {
                                await sleep(1200);
                            }
                        }
                    }

                    if (!isRunning) break;

                    // 5. 次へ
                    await sleep(2500);

                } catch (error) {
                    log(`Loop error: ${error.message}`);
                    await sleep(2000);
                }
            }
            
            log('=== Training loop ended ===');
        }

        // UI更新
        function updateStatus(question, answer, feedback, correct) {
            document.getElementById('currentQuestion').textContent = question;
            document.getElementById('userAnswer').textContent = answer;
            document.getElementById('feedback').textContent = feedback;
            document.getElementById('correctAnswer').textContent = correct;
        }

        function updateStats() {
            document.getElementById('questionCount').textContent = stats.total;
            document.getElementById('correctCount').textContent = stats.correct;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 設定
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const btn = event.target;
            
            if (panel.classList.contains('collapsed')) {
                panel.classList.remove('collapsed');
                btn.textContent = '閉じる';
            } else {
                panel.classList.add('collapsed');
                btn.textContent = '開く';
            }
        }

        function updateThinkTime(value) {
            document.getElementById('thinkTimeValue').textContent = value;
            saveSettings();
        }

        function updateRepeatCount(value) {
            repeatCount = parseInt(value);
            document.getElementById('repeatCountValue').textContent = value;
            saveSettings();
        }

        function setSensitivity(btn) {
            // すべてのボタンから active を削除
            document.querySelectorAll('[data-sensitivity]').forEach(b => b.classList.remove('active'));
            // クリックされたボタンに active を追加
            btn.classList.add('active');
            sensitivity = btn.dataset.sensitivity;
            log(`Sensitivity set to: ${sensitivity}`);
            saveSettings();
        }

        function toggleTheme(btn) {
            btn.classList.toggle('active');
            selectedThemes = Array.from(document.querySelectorAll('.theme-btn.active'))
                .map(b => b.dataset.theme)
                .filter(t => t); // data-theme が存在するもののみ
            
            if (selectedThemes.length === 0) {
                selectedThemes = ['liverpool'];
                btn.classList.add('active');
            }
            
            log(`Themes: ${selectedThemes.join(', ')}`);
            saveSettings();
        }

        // 文法選択関連の関数
        function toggleGrammar(btn) {
            btn.classList.toggle('active');
            updateGrammarSelection();
        }

        function updateGrammarSelection() {
            selectedGrammars = Array.from(document.querySelectorAll('[data-grammar].active'))
                .map(btn => btn.dataset.grammar);
            
            const count = document.getElementById('grammarCount');
            const totalGrammars = document.querySelectorAll('[data-grammar]').length;
            
            if (selectedGrammars.length === 0) {
                count.textContent = '全て選択';
                count.style.color = '#4ecdc4';
            } else if (selectedGrammars.length === totalGrammars) {
                count.textContent = '全て選択';
                count.style.color = '#4ecdc4';
            } else {
                count.textContent = `${selectedGrammars.length}個選択`;
                count.style.color = '#4ecdc4';
            }
            
            log(`Selected grammars: ${selectedGrammars.join(', ') || 'all'}`);
            saveSettings();
        }

        function selectAllGrammars() {
            document.querySelectorAll('[data-grammar]').forEach(btn => {
                btn.classList.add('active');
            });
            updateGrammarSelection();
        }

        function clearAllGrammars() {
            document.querySelectorAll('[data-grammar]').forEach(btn => {
                btn.classList.remove('active');
            });
            updateGrammarSelection();
        }

        function addNewGrammarButtons() {
            const customGrammars = [...new Set(customQuestions.map(q => q.grammar))];
            const existingGrammars = Array.from(document.querySelectorAll('[data-grammar]'))
                .map(btn => btn.dataset.grammar);
            
            const newGrammars = customGrammars.filter(g => 
                !existingGrammars.includes(g) && g !== 'その他'
            );
            
            if (newGrammars.length > 0) {
                const grammarSelector = document.getElementById('grammarSelector');
                
                newGrammars.forEach(grammar => {
                    const btn = document.createElement('button');
                    btn.className = 'theme-btn active';
                    btn.dataset.grammar = grammar;
                    btn.onclick = function() { toggleGrammar(this); };
                    btn.style.fontSize = '0.75rem';
                    btn.style.padding = '6px';
                    btn.textContent = grammar;
                    grammarSelector.appendChild(btn);
                });
                
                updateGrammarSelection();
                log(`Added new grammar categories: ${newGrammars.join(', ')}`);
            }
        }

        function saveSettings() {
            try {
                localStorage.setItem('thinkTime', document.getElementById('thinkTime').value);
                localStorage.setItem('repeatCount', repeatCount);
                localStorage.setItem('sensitivity', sensitivity);
                localStorage.setItem('selectedThemes', JSON.stringify(selectedThemes));
                localStorage.setItem('selectedGrammars', JSON.stringify(selectedGrammars));
                
                const apiKey = document.getElementById('apiKey').value.trim();
                if (apiKey) {
                    localStorage.setItem('apiKey', apiKey);
                }
                
                log('Settings saved');
            } catch (e) {
                log(`Save error: ${e.message}`);
            }
        }

        function loadSettings() {
            try {
                const thinkTime = localStorage.getItem('thinkTime');
                if (thinkTime) {
                    document.getElementById('thinkTime').value = thinkTime;
                    document.getElementById('thinkTimeValue').textContent = thinkTime;
                }

                const savedRepeatCount = localStorage.getItem('repeatCount');
                if (savedRepeatCount) {
                    repeatCount = parseInt(savedRepeatCount);
                    document.getElementById('repeatCount').value = repeatCount;
                    document.getElementById('repeatCountValue').textContent = repeatCount;
                }

                const savedSensitivity = localStorage.getItem('sensitivity');
                if (savedSensitivity) {
                    sensitivity = savedSensitivity;
                    document.querySelectorAll('[data-sensitivity]').forEach(btn => {
                        if (btn.dataset.sensitivity === sensitivity) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }

                const themes = localStorage.getItem('selectedThemes');
                if (themes) {
                    selectedThemes = JSON.parse(themes);
                    document.querySelectorAll('[data-theme]').forEach(btn => {
                        if (selectedThemes.includes(btn.dataset.theme)) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }

                const savedGrammars = localStorage.getItem('selectedGrammars');
                if (savedGrammars) {
                    selectedGrammars = JSON.parse(savedGrammars);
                    document.querySelectorAll('[data-grammar]').forEach(btn => {
                        if (selectedGrammars.includes(btn.dataset.grammar)) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                    updateGrammarSelection();
                }
                
                const apiKey = localStorage.getItem('apiKey');
                if (apiKey) {
                    document.getElementById('apiKey').value = apiKey;
                }
                
                // カスタム問題を読み込み
                const savedQuestions = localStorage.getItem('customQuestions');
                if (savedQuestions) {
                    customQuestions = JSON.parse(savedQuestions);
                    if (customQuestions.length > 0) {
                        const statusDiv = document.getElementById('csvStatus');
                        statusDiv.textContent = `✓ ${customQuestions.length}問を読み込み済み`;
                        statusDiv.style.color = '#4ecdc4';
                        
                        // 新しい文法カテゴリーを追加
                        addNewGrammarButtons();
                    }
                    log(`Loaded ${customQuestions.length} custom questions from storage`);
                }
                
                log('Settings loaded');
            } catch (e) {
                log(`Load error: ${e.message}`);
            }
        }

        // ページ離脱防止
        window.addEventListener('beforeunload', (e) => {
            if (isRunning) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
