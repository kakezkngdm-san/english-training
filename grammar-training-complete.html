<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>文法別英作文トレーニング</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            max-height: 50vh;
            overflow-y: auto;
        }

        .settings-panel.collapsed {
            max-height: 50px;
            overflow: hidden;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .settings-header h2 {
            font-size: 1.1rem;
            color: #4ecdc4;
        }

        .toggle-btn {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            color: #4ecdc4;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .setting-group {
            margin-bottom: 12px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #b8b8b8;
        }

        .grammar-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .grammar-btn {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .grammar-btn.active {
            background: #4ecdc4;
            border-color: #4ecdc4;
            color: #1a1a2e;
        }

        .main-control {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .status-display {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .status-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            line-height: 1.5;
        }

        .question { color: #4ecdc4; font-size: 1.2rem; font-weight: bold; }
        .answer { color: #ffd93d; }
        .feedback { color: #95e1d3; }
        .correct { color: #b8b8b8; }

        .control-button {
            width: 200px;
            height: 80px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
            transition: transform 0.2s;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .control-button.listening {
            background: linear-gradient(135deg, #f38181 0%, #e84545 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #b8b8b8;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4ecdc4;
        }

        .init-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .init-overlay h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #4ecdc4;
            text-align: center;
        }

        .init-button {
            padding: 18px 50px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border: none;
            border-radius: 15px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
            color: #4ecdc4;
        }
    </style>
</head>

    <!-- 初期化オーバーレイ -->
    <div id="initOverlay" class="init-overlay">
        <h1>🎯 文法別英作文トレーニング</h1>
        <p style="margin-bottom: 25px; color: #b8b8b8; text-align: center;">
            音量を上げてください<br>
            サイレントモードを解除してください
        </p>
        <button class="init-button" onclick="initializeApp()">タップして開始</button>
    </div>

    <!-- 設定パネル -->
    <div id="settingsPanel" class="settings-panel collapsed">
        <div class="settings-header">
            <h2>⚙️ 設定</h2>
            <button class="toggle-btn" onclick="toggleSettings()">開く</button>
        </div>

        <div id="settingsContent">
            <div class="setting-group">
                <label>考える時間: <span class="slider-value" id="thinkTimeValue">8</span>秒</label>
                <input type="range" id="thinkTime" min="5" max="15" value="8" oninput="updateThinkTime(this.value)">
            </div>

            <div class="setting-group">
                <label>文法選択:</label>
                <div class="grammar-selector">
                    <button class="grammar-btn active" data-grammar="be動詞" onclick="toggleGrammar(this)">be動詞</button>
                    <button class="grammar-btn active" data-grammar="一般動詞" onclick="toggleGrammar(this)">一般動詞</button>
                    <button class="grammar-btn active" data-grammar="過去形" onclick="toggleGrammar(this)">過去形</button>
                    <button class="grammar-btn active" data-grammar="未来形" onclick="toggleGrammar(this)">未来形</button>
                    <button class="grammar-btn active" data-grammar="進行形" onclick="toggleGrammar(this)">進行形</button>
                </div>
                <div style="margin-top: 8px; font-size: 0.75rem; color: #b8b8b8;">
                    選択なし=全て出題
                </div>
            </div>

            <div class="setting-group">
                <label>カスタム問題CSV:</label>
                <input type="file" id="csvUpload" accept=".csv" onchange="handleCSVUpload(event)" style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 0.85rem;">
                <div style="margin-top: 5px; font-size: 0.75rem; color: #b8b8b8;">
                    形式: 日本語,英語,文法<br>
                    例: このプロジェクトは予定通りです,The project is on schedule,be動詞
                </div>
                <div id="csvStatus" style="margin-top: 5px; font-size: 0.8rem; color: #4ecdc4;"></div>
            </div>
        </div>
    </div>

    <!-- メインコントロール -->
    <div class="main-control">
        <div class="status-display">
            <div class="status-item question" id="currentQuestion">準備中...</div>
            <div class="status-item answer" id="userAnswer"></div>
            <div class="status-item feedback" id="feedback"></div>
            <div class="status-item correct" id="correctAnswer"></div>
        </div>

        <button id="controlButton" class="control-button" onclick="toggleTraining()">
            トレーニング開始
        </button>

        <div class="stats">
            <div class="stat-item">
                <div class="label">問題数</div>
                <div class="value" id="questionCount">0</div>
            </div>
            <div class="stat-item">
                <div class="label">正解</div>
                <div class="value" id="correctCount">0</div>
            </div>
        </div>
    </div>

        // 音声合成
        function speak(text, lang = 'ja-JP') {
            return new Promise((resolve) => {
                speechSynthesis.cancel();
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = lang === 'ja-JP' ? 0.9 : 0.85;
                    utterance.onend = () => resolve();
                    speechSynthesis.speak(utterance);
                }, 100);
            });
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 初期化
        async function initializeApp() {
            try {
                document.getElementById('initOverlay').classList.add('hidden');
                
                // 音声認識初期化
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;

                loadSettings();
                await speak('初期化完了');
                updateStatus('準備完了！', '', 'トレーニング開始ボタンを押してください', '');
            } catch (error) {
                alert(`初期化エラー: ${error.message}`);
            }
        }

        // 設定トグル
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const btn = event.target;
            panel.classList.toggle('collapsed');
            btn.textContent = panel.classList.contains('collapsed') ? '開く' : '閉じる';
        }

        function updateThinkTime(value) {
            document.getElementById('thinkTimeValue').textContent = value;
            saveSettings();
        }

        function toggleGrammar(btn) {
            btn.classList.toggle('active');
            updateSelectedGrammars();
        }

        function updateSelectedGrammars() {
            selectedGrammars = Array.from(document.querySelectorAll('.grammar-btn.active'))
                .map(btn => btn.dataset.grammar);
            saveSettings();
        }

        // CSV処理
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                customQuestions = [];
                
                lines.forEach((line) => {
                    line = line.trim();
                    if (!line || line.startsWith('#')) return;
                    
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 2) {
                        customQuestions.push({
                            japanese: parts[0],
                            english: parts[1],
                            grammar: parts[2] || 'その他'
                        });
                    }
                });
                
                localStorage.setItem('customQuestions', JSON.stringify(customQuestions));
                
                const statusDiv = document.getElementById('csvStatus');
                if (customQuestions.length > 0) {
                    statusDiv.textContent = `✓ ${customQuestions.length}問を読み込みました`;
                    speak(`${customQuestions.length}問のカスタム問題を読み込みました`);
                }
            };
            reader.readAsText(file);
        }

        // 問題生成
        function generateQuestion() {
            let questions = customQuestions.length > 0 ? customQuestions : builtInQuestions;
            
            // 文法フィルター
            if (selectedGrammars.length > 0) {
                questions = questions.filter(q => selectedGrammars.includes(q.grammar));
            }
            
            if (questions.length === 0) {
                speak('選択された文法の問題がありません');
                return null;
            }
            
            return questions[Math.floor(Math.random() * questions.length)];
        }

        // 音声認識
        function startListening() {
            return new Promise((resolve) => {
                if (!recognition) {
                    resolve();
                    return;
                }

                isListening = true;
                const button = document.getElementById('controlButton');
                button.classList.add('listening');
                button.textContent = '聞いています...';

                const thinkTime = parseInt(document.getElementById('thinkTime').value) * 1000;

                const timeout = setTimeout(() => {
                    if (isListening) {
                        isListening = false;
                        try { recognition.stop(); } catch (e) {}
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        resolve();
                    }
                }, thinkTime);

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript.trim();
                    if (transcript && isListening) {
                        currentAnswer = transcript;
                        isListening = false;
                        clearTimeout(timeout);
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        try { recognition.stop(); } catch (e) {}
                        resolve();
                    }
                };

                recognition.onerror = () => {
                    if (isListening) {
                        isListening = false;
                        clearTimeout(timeout);
                        button.classList.remove('listening');
                        button.textContent = '一時停止';
                        resolve();
                    }
                };

                try {
                    recognition.start();
                } catch (error) {
                    isListening = false;
                    clearTimeout(timeout);
                    button.classList.remove('listening');
                    resolve();
                }
            });
        }

        // 評価
        function evaluateAnswer(userAnswer, correctAnswer) {
            const userLower = userAnswer.toLowerCase().trim();
            const correctLower = correctAnswer.toLowerCase().trim();

            if (userLower === correctLower) {
                return { score: 'perfect', feedback: '完璧です！' };
            }

            const correctWords = correctLower.split(/\s+/);
            const matchedWords = correctWords.filter(word => userLower.includes(word));
            const matchRate = matchedWords.length / correctWords.length;

            if (matchRate > 0.7) {
                return { score: 'good', feedback: 'いいですね！' };
            } else if (matchRate > 0.4) {
                return { score: 'acceptable', feedback: '惜しい！' };
            } else {
                return { score: 'incorrect', feedback: '正解を確認' };
            }
        }

        // トレーニングループ
        async function runTrainingLoop() {
            while (isRunning) {
                try {
                    currentQuestion = generateQuestion();
                    if (!currentQuestion) break;
                    
                    currentAnswer = null;
                    stats.total++;
                    updateStats();

                    updateStatus(currentQuestion.japanese, '', '', '');
                    await speak(currentQuestion.japanese);
                    if (!isRunning) break;

                    await sleep(800);
                    await startListening();
                    if (!isRunning) break;

                    if (currentAnswer) {
                        const evaluation = evaluateAnswer(currentAnswer, currentQuestion.english);
                        
                        if (evaluation.score === 'perfect' || evaluation.score === 'good') {
                            stats.correct++;
                        }
                        updateStats();

                        updateStatus(currentQuestion.japanese, currentAnswer, evaluation.feedback, `正解: ${currentQuestion.english}`);
                        await speak(evaluation.feedback);
                        await sleep(500);
                        await speak(currentQuestion.english, 'en-US');
                    } else {
                        updateStatus(currentQuestion.japanese, '(回答なし)', '正解を確認', `正解: ${currentQuestion.english}`);
                        await speak('正解を言います');
                        await sleep(300);
                        await speak(currentQuestion.english, 'en-US');
                    }

                    if (!isRunning) break;
                    await sleep(2500);

                } catch (error) {
                    await sleep(2000);
                }
            }
        }

        function toggleTraining() {
            if (isRunning) {
                stopTraining();
            } else {
                startTraining();
            }
        }

        function startTraining() {
            isRunning = true;
            document.getElementById('controlButton').textContent = '一時停止';
            runTrainingLoop();
        }

        function stopTraining() {
            isRunning = false;
            isListening = false;
            try { recognition.stop(); } catch (e) {}
            document.getElementById('controlButton').textContent = 'トレーニング開始';
            document.getElementById('controlButton').classList.remove('listening');
        }

        function updateStatus(question, answer, feedback, correct) {
            document.getElementById('currentQuestion').textContent = question;
            document.getElementById('userAnswer').textContent = answer;
            document.getElementById('feedback').textContent = feedback;
            document.getElementById('correctAnswer').textContent = correct;
        }

        function updateStats() {
            document.getElementById('questionCount').textContent = stats.total;
            document.getElementById('correctCount').textContent = stats.correct;
        }

        function saveSettings() {
            try {
                localStorage.setItem('thinkTime', document.getElementById('thinkTime').value);
                localStorage.setItem('selectedGrammars', JSON.stringify(selectedGrammars));
            } catch (e) {}
        }

        function loadSettings() {
            try {
                const thinkTime = localStorage.getItem('thinkTime');
                if (thinkTime) {
                    document.getElementById('thinkTime').value = thinkTime;
                    document.getElementById('thinkTimeValue').textContent = thinkTime;
                }

                const savedGrammars = localStorage.getItem('selectedGrammars');
                if (savedGrammars) {
                    selectedGrammars = JSON.parse(savedGrammars);
                    document.querySelectorAll('.grammar-btn').forEach(btn => {
                        if (selectedGrammars.includes(btn.dataset.grammar)) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }

                const savedQuestions = localStorage.getItem('customQuestions');
                if (savedQuestions) {
                    customQuestions = JSON.parse(savedQuestions);
                    if (customQuestions.length > 0) {
                        document.getElementById('csvStatus').textContent = `✓ ${customQuestions.length}問を読み込み済み`;
                    }
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
